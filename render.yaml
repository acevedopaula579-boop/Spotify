databases:
  - name: popularidad-db
    plan: free
    databaseName: popularidad
    user: popularidad

services:
  - type: web
    name: api-popularidad
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: popularidad-db
          property: connectionString
